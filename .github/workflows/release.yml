name: Release

# Push a tag like v1.0.0 (must equal "version" in manifest.json) to test, package and publish a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "tag=${GITHUB_REF_NAME} manifest=v${MANIFEST_VERSION}"
          if [ "v${MANIFEST_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version v${MANIFEST_VERSION}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Stage extension files
        run: |
          mkdir -p build/json-studio dist
          cp -r manifest.json background.js worker.js studio.html studio.css studio.js core icons build/json-studio/
          find build -name '.DS_Store' -delete
          find build -type f | sort

      - name: Package zip
        run: |
          (cd build/json-studio && zip -r -X "${GITHUB_WORKSPACE}/dist/json-studio-${GITHUB_REF_NAME}.zip" .)
          unzip -l "dist/json-studio-${GITHUB_REF_NAME}.zip"

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "JSON Studio ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
